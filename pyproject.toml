[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coolroof"
version = "1.0.0"
description = "Cool Roofing Intelligence - cost, comfort and energy-savings predictor"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "reportlab>=4.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coolroof = "coolroof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
